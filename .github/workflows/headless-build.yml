# Builds the headless fork for Debian trixie on arm64 (Raspberry Pi) and
# amd64 (an x86 box such as an HP MicroServer).
name: headless-build

on:
  push:
    branches: [headless]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the .deb as a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deb:
    name: deb-trixie-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates file \
            cmake build-essential ninja-build \
            xorg-dev libx11-dev libxtst-dev libssl-dev libxkbfile-dev \
            qt6-base-dev qt6-tools-dev libxkbregistry-dev libxkbcommon-dev \
            libei-dev libportal-dev help2man libinput-dev libudev-dev python3 >/dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force https://github.com/deskflow/deskflow.git 'refs/tags/v*:refs/tags/v*' >/dev/null 2>&1 || true
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          n=$(git rev-list --count "$base"..HEAD)
          version="${base#v}-headless.${n}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version (on top of $base)"

      - name: Configure
        run: >
          cmake -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_INSTALL_PREFIX=/usr
          -DPACKAGE_VERSION_LABEL="${{ steps.version.outputs.version }}"

      - name: Check the evdev backend is enabled
        run: grep -q "WINAPI_EVDEV" build/build.ninja

      - name: Build package
        run: cmake --build build --config Release -j4 --target package

      - name: Inspect package
        id: deb
        shell: bash
        run: |
          deb=$(ls build/*.deb | head -1)
          echo "path=$deb" >> "$GITHUB_OUTPUT"
          dpkg-deb -I "$deb"
          strings build/bin/deskflow-core > /tmp/strings.txt
          grep -q "using headless evdev backend" /tmp/strings.txt

      - uses: actions/upload-artifact@v4
        with:
          name: deskflow-${{ steps.version.outputs.version }}-debian-trixie-${{ matrix.arch }}
          path: ${{ steps.deb.outputs.path }}

  # One release with both packages, once both built: a release step in each
  # build job would race to create the same release.
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deskflow-*
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -la dist
          tag="headless-v${{ needs.deb.outputs.version }}"
          gh release create "$tag" dist/*.deb             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "$tag"             --notes "Headless server build on top of upstream ${{ needs.deb.outputs.base }}, for Debian trixie on arm64 and amd64. See HEADLESS.md."
